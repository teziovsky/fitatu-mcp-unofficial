services:
  fitatu-mcp:
    build: .
    container_name: fitatu-mcp
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8000"
    networks:
      - default
      - proxy

networks:
  proxy:
    name: proxy
    external: true
